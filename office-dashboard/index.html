<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F2EEE6">
  <title>Office</title>
  <script>
    // Colour theme — applied before CSS so there's no flash. ?theme=<name> overrides and is remembered.
    // Graphite from sunset to sunrise (cached weather's times, same rule as isNight() in js/main.js)
    // is applied here too, unless it was turned off.
    (function () {
      var t = null, auto = '1', w = null, m = /[?&]theme=([a-z]+)/.exec(location.search);
      try {
        if (m) localStorage.setItem('office.theme', m[1]);
        t = localStorage.getItem('office.theme');
        auto = localStorage.getItem('office.nightTheme') || '1';
        w = JSON.parse(localStorage.getItem('weather'));
      } catch (e) { t = m && m[1]; }
      var n = new Date(), now = n.getHours() * 60 + n.getMinutes(), rise = 420, set = 1080;
      var p = function (x) { return x < 10 ? '0' + x : '' + x; };
      var hm = function (s) { return typeof s === 'string' && s.length >= 16 ? +s.slice(11, 13) * 60 + +s.slice(14, 16) : null; };
      var d = w && w.daily;
      if (d && d.time && d.sunrise && d.sunset && d.time.length) {
        var key = n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()), i = d.time.indexOf(key);
        if (i < 0) i = d.time[0] > key ? 0 : d.time.length - 1;
        if (hm(d.sunrise[i]) != null && hm(d.sunset[i]) != null) { rise = hm(d.sunrise[i]); set = hm(d.sunset[i]); }
      }
      if (auto === '1' && (now < rise || now >= set)) t = 'graphite';
      if (t && t !== 'paper') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="stage" id="stage">
    <nav class="rail" id="rail" aria-label="Views">
      <button class="rail-item" data-go="today"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
      <button class="rail-item" data-go="calendar"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button class="rail-item" data-go="weather"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><path d="M8.5 2.5v1.3M3.4 4.6l.9.9M1.8 9.6h1.3M13.6 4.6l-.9.9"/><path d="M5.3 12.3a4 4 0 0 1 6.9-4.4"/><path d="M9.5 20h8.3a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-9.9 1.4A2.9 2.9 0 0 0 9.5 20z"/></svg><span>Weather</span></button>
      <button class="rail-item" data-go="photos"><svg class="i" width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span></button>
      <button class="rail-clock" id="railClock" aria-label="Clock — press and hold for display settings"></button>
    </nav>

    <main class="views">
      <section class="view" id="view-today">
        <div class="today">
          <section class="left">
            <div class="clock">
              <div class="time"><span class="num" id="time"></span><span class="ampm" id="ampm"></span></div>
              <div class="date"><b id="weekday"></b> <span class="serif" id="date"></span></div>
            </div>
            <div class="weather" id="weather"></div>
          </section>
          <section class="right">
            <div class="next" id="next"></div>
            <div class="agenda" id="agenda"></div>
          </section>
        </div>
      </section>
      <section class="view" id="view-calendar"></section>
      <section class="view" id="view-weather"></section>
      <section class="view view--bleed" id="view-photos"></section>
    </main>

    <div class="status" id="status"></div>
    <div class="settings" id="settings"></div>
  </div>

  <script>
    // Wall-display self-healing: if the bundle failed to load, reload until it starts.
    setTimeout(function () { if (!window.OFFICE_READY) location.reload(); }, 15000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
